  :root {
    --bg: #0e0e11; --surface: #16161b; --surface2: #1e1e25; --border: #2a2a35;
    --text: #e8e6e1; --dim: #8f8d96;
    --sup: #4ecdc4; --inf: #f97316; --r: #60a5fa; --core: #a78bfa; --cardio: #facc15;
    --ok: #4ade80; --warn: #fb7185;
    --acc: var(--sup);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Source Sans 3', system-ui, sans-serif; line-height: 1.45;
    padding-inline: 12px; padding-block: 0 6.5rem;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1, h2, h3, .tab b, .reps, .timer-num, .count { font-family: 'Oswald', 'Arial Narrow', sans-serif; }

  /* topo fixo: t\ed tulo, fase e abas */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding-block: .7rem .5rem;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .6rem; }
  h1 { font-size: 1.15rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; line-height: 1.1; }
  .phase { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 3px; flex-shrink: 0; }
  .phase button {
    border: 0; background: transparent; color: var(--dim); font: 600 .74rem 'Source Sans 3', sans-serif;
    padding: .38rem .7rem; border-radius: 99px; cursor: pointer; white-space: nowrap;
  }
  .phase button[aria-pressed="true"] { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; }
  .tab {
    border: 1px solid var(--border); background: var(--surface); color: var(--dim);
    border-radius: 10px; padding: .45rem .2rem .4rem; cursor: pointer; text-align: center;
    font: 500 .68rem 'Source Sans 3', sans-serif; line-height: 1.2;
  }
  .tab b { display: block; font-size: .98rem; font-weight: 600; letter-spacing: .5px; color: var(--text); }
  .tab small { display: block; font-size: .64rem; margin-top: .1rem; font-variant-numeric: tabular-nums; }
  .tab[data-k="sup"] b { color: var(--sup); } .tab[data-k="inf"] b { color: var(--inf); } .tab[data-k="guia"] b { color: var(--cardio); }
  .tab[aria-selected="true"] { background: var(--surface2); border-color: var(--acc); color: var(--text); }
  .tab.done small { color: var(--ok); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* painel */
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; margin-block: .4rem .6rem; }
  .panel-head h2 { font-size: 1.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--acc); line-height: 1.15; }
  .panel-head p { color: var(--dim); font-size: .82rem; }
  .count { font-size: .95rem; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count b { color: var(--text); font-weight: 600; }
  .bar { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-bottom: .8rem; }
  .bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .25s; }

  .group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: .7rem; }
  .group.reab { border-style: dashed; border-color: #60a5fa80; }
  .gh { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .5rem .8rem; background: var(--surface2);
    font: 600 .68rem 'Source Sans 3', sans-serif; text-transform: uppercase; letter-spacing: 1.2px; width: 100%; border: 0; color: var(--text); cursor: pointer; text-align: left; }
  .gh span:last-child::after { content: ' \25be '; }
  .group.closed .gh span:last-child::after { content: ' \25b8 '; }

<body>

</div>

<script>
(function () {

        { n: 'Mesa flexora', s: [3], r: '10\u201312', ss: 1, rest: 0 },

        { n: 'Panturrilha em p\u00e9', s: [3], r: '12\u201315', rest: 45 } ] },
      { g: 'Core', c: 'core', ex: [
        { n: 'Prancha frontal', s: [2], r: '45s', u: 'tempo', ss: 1, rest: 0 },

    supB: { tab: 'Sup B', k: 'sup', title: 'Superior B', sub: 'Quinta \u00b7 \u00eanfase em empurrar', groups: [
      { g: 'Principal', c: 'main', ex: [
        { n: 'Supino inclinado com halteres', s: [4], r: '8\u201312', ss: 1, rest: 0 },
        { n: 'Remada sentada m\u00e1quina', s: [4], r: '10\u201312', rest: 75 },

        { n: 'Rosca martelo sentado', s: [3], r: '10\u201312', ss: 1, rest: 0 },

    infB: { tab: 'Inf B', k: 'inf', title: 'Inferior B', sub: 'Sexta \u00b7 \u00eanfase em posterior e gl\u00fateo', groups: [

        { n: 'Stiff com halteres', d: 'Coluna neutra, desce at\u00e9 sentir o posterior', s: [3], r: '8\u201310', rest: 75 },
        { n: 'Cadeira extensora', s: [3], r: '12\u201315', ss: 1, rest: 0 },
        { n: 'Mesa flexora', s: [3], r: '10\u201312', rest: 60 },

  };
  function minutes(id) {
    var t = 0;
    D[id].groups.forEach(function (g) { g.ex.forEach(function (e) {
      var w = /s$/.test(e.r) ? parseInt(e.r, 10) * (e.u === 'por lado' ? 2 : 1) + 10 : 45;

    return Math.round(t / 60);
  }
  var ORDER = ['supA', 'infA', 'supB', 'infB', 'guia'];
  var BYDAY = { 1: 'supA', 2: 'infA', 4: 'supB', 5: 'infB' };

  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }

  var today = new Date().toISOString().slice(0, 10);

  var phase = 0;

  var tabsEl = document.getElementById('tabs'), panel = document.getElementById('panel');

  function exList(id) {

  }
  function progress(id) {
    var tot = 0, dn = 0, d = st.done[id] || {};
    exList(id).forEach(function (x) { var n = x.e.s[phase]; tot += n; dn += Math.min(n, (d[x.key] || []).filter(Boolean).length); });
    return [dn, tot];
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    ORDER.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', id === cur ? 'true' : 'false');

      }
      b.onclick = function () { cur = id; save('treino-aba', id); render(); window.scrollTo(0, 0); };
      tabsEl.appendChild(b);
    });
  }

  function exHTML(id, x) {
    var e = x.e, n = e.s[phase], d = ((st.done[id] || {})[x.key]) || [];
    var complete = d.filter(Boolean).length >= n;
    var h = '<div class="ex' + (complete ? ' complete' : '') + (e.ss ? ' ss' : '') + (x.pss ? ' ss2' : '') + '"><div class="ex-name">' +
      (e.ss ? '<span class="bi">bi-set \u00b7 alterne com o de baixo</span>' : '') + e.n +
      (e.tag ? '<span class="new">' + (x.g === 'reab' ? 'adutor' : 'novo') + '</span>' : '') +
      (e.d ? '<em>' + e.d + '</em>' : '') +
      '<span class="reps">' + e.r + '<small>' + (e.u || 'reps') + '</small></span></div><div class="sets">';
    for (var i = 0; i < n; i++) {
      h += '<button type="button" class="set" data-id="' + id + '" data-key="' + x.key + '" data-i="' + i + '" data-rest="' +
        (e.rest === 0 ? 0 : (e.rest || 90)) + '" aria-pressed="' + (d[i] ? 'true' : 'false') + '" aria-label="' + e.n + ', s\u00e9rie ' + (i + 1) + '">' + (i + 1) + '</button>';

  }

  function renderDay(id) {
    var day = D[id], list = exList(id), p = progress(id);
    var h = '<div class="panel-head"><div><h2>' + day.title + '</h2><p>' + day.sub + ' \u00b7 <b class="mins">~' + minutes(id) + ' min</b> + reab.</p></div>' +
      '<div class="count"><b id="cdn">' + p[0] + '</b>/' + p[1] + ' s\u00e9ries</div></div>' +

  function render() {

    st.done[id] = st.done[id] || {}; var arr = st.done[id][key] = st.done[id][key] || [];

    if (arr[i]) { if (+b.dataset.rest > 0) startTimer(+b.dataset.rest); else { stopTimer(); tLbl.innerHTML = 'Bi-set: v\u00e1 direto<br>para o pr\u00f3ximo'; } }

  /* cron\u00f4metro */
  var tEl = document.getElementById('timer'), tNum = document.getElementById('tnum'), tLbl = document.getElementById('tlbl'), tId = null, tEnd = 0;
  function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function tick() {

  /* mant\u00e9m a tela acesa durante o treino */
  var lock = null;
  function wake() { try { if (!lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && tId) wake(); });

  render();
})();
</script>
